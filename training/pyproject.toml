[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishnet-training"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6",
  "torchvision>=0.21",
  "numpy",
  "pillow",
  "matplotlib",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["fishnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
